services:
  db:
    image: mysql:8.0
    container_name: final_project_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secure_root_password
      MYSQL_DATABASE: fp_sbd
      MYSQL_USER: user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
      image: phpmyadmin:latest
      container_name: final_project_pma
      restart: always
      environment:
        PMA_HOST: db
        PMA_PORT: 3306
      ports:
        - "8080:80"
      depends_on:
        - db

volumes:
  db_data:
