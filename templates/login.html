{% extends "base.html" %} {% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5 col-md-8">
    <div class="auth-panel rounded-4 p-4 p-lg-5">
      <div class="mb-4">
        <p class="text-uppercase text-secondary fw-semibold mb-1">Masuk</p>
        <h1 class="h3 fw-bold mb-0">Login ke akun UPBG</h1>
      </div>

      <form method="post">
        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="loginEmail"
            type="email"
            name="email"
            placeholder="name@example.com"
            required
          />
          <label for="loginEmail">Email</label>
        </div>

        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="loginPassword"
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <label for="loginPassword">Password</label>
        </div>

        <button class="btn btn-dark btn-lg w-100" type="submit">Masuk</button>
      </form>

      <p class="mt-3 mb-0 text-secondary">
        Belum punya akun?
        <a href="{{ url_for('register') }}">Daftar di sini</a>.
      </p>
    </div>
  </div>
</div>
{% endblock %}
